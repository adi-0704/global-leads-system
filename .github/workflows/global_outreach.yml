name: Global Lead Outreach Campaign

on:
  schedule:
    # Runs daily at 09:00 UTC = 2:30 PM IST
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run? (true = log only, false = send real emails)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      limit:
        description: 'Max Google Maps results per search'
        required: false
        default: '50'
      target:
        description: 'Target emails to send today'
        required: false
        default: '50'
      no_scrape:
        description: 'Skip scraping, only send emails from existing leads'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  global-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'global-outreach/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r global-outreach/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Global Scraper & Outreach
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER:     ${{ secrets.SMTP_USER || 'cupboard587@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || 'ykzv xkxl vecb dlgx' }}
          SMTP_FROM:     ${{ secrets.SMTP_FROM || 'cupboard587@gmail.com' }}
          IMAP_HOST:     ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
          IMAP_USER:     ${{ secrets.IMAP_USER || 'cupboard587@gmail.com' }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD || 'ykzv xkxl vecb dlgx' }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "======================================"
          echo "  GLOBAL OUTREACH — 2:30 PM IST"
          echo "  Target: 50 emails/day"
          echo "======================================"
          ARGS="--target ${{ github.event.inputs.target || '50' }} --limit ${{ github.event.inputs.limit || '50' }} --max-iterations 10"
          [ "${{ github.event.inputs.dry_run }}" = "true" ]   && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.no_scrape }}" = "true" ] && ARGS="$ARGS --no-scrape"
          echo "Running: python global-outreach/scrape_and_outreach.py $ARGS"
          # Run outreach; if it fails (scraper crash), retry with --no-scrape to still send emails
          if ! eval python global-outreach/scrape_and_outreach.py $ARGS; then
            echo "[Resilience] Full run failed. Retrying with --no-scrape to send emails from existing leads..."
            eval python global-outreach/scrape_and_outreach.py $ARGS --no-scrape || echo "[Resilience] --no-scrape also failed. Will still export whatever data is in DB."
          fi

      - name: Export data.json
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER || 'cupboard587@gmail.com' }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || 'cupboard587@gmail.com' }}
        run: python global-outreach/generate_data_json.py

      - name: Commit Results
        if: always()
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add global-outreach/leads.db global-outreach/data.json global-outreach/sender_email.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: global outreach daily sync [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
